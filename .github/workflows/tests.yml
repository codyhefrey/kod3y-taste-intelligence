name: Application quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline browser JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No inline web JavaScript found")
          Path("/tmp/kod3y-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/kod3y-inline.js
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
